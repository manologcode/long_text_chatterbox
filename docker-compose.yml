services:
  app:
    image: manologcode/long_text_chatterbox
    build: .
    restart: always
    container_name: long_text_chatterbox
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "5009"]
    ports:
      - "5009:5009"
    volumes:
      - ./app:/app
      - chatterbox_data:/data
    environment:
      - SERVER_URL_CHATTERBOX=http://192.168.1.69:8020
      - AUDIO_FILES_DIR=/data/audio_files
      - TEMP_DIR=/data/temp_audio
      - AUDIO_TAGS_DIR=/app/effects

volumes:
  chatterbox_data:
